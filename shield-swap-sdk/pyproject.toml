[project]
name = "shield-swap-sdk"
version = "0.5.1"
description = "Python SDK for the shield swap AMM Dex on Aleo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aleo-sdk>=0.5.1", "requests>=2"]   # 0.5.1: first imported account becomes the default signer

[project.optional-dependencies]
async = ["httpx>=0.27"]
# mcp 2.0 renamed the Server registration API and Tool fields — pin to 1.x
# until the server is ported.
mcp = ["mcp>=1.0,<2"]
dev = ["datamodel-code-generator>=0.25", "pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/aleo_shield_swap"]

# Ship the runnable example without copying local profiles or test artifacts.
[tool.hatch.build.targets.wheel.force-include]
"examples/first-swap/swap.py" = "aleo_shield_swap/examples/first_swap/swap.py"
"examples/first-swap/README.md" = "aleo_shield_swap/examples/first_swap/README.md"

[workspace]  # Prevent parent workspace capture

[package]
name = "aleo-abi"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Python bindings for ABI generation from Aleo bytecode (via Leo's leo-abi crate)"

[lib]
name = "_aleo_abi"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py37", "anyhow"] }
serde_json = "1"
leo-abi = { git = "https://github.com/ProvableHQ/leo", rev = "c82f149e97b8279e3c453cbf98e41eec46aec3e7", package = "leo-abi", features = ["aleo-bytecode"] }
leo-ast = { git = "https://github.com/ProvableHQ/leo", rev = "c82f149e97b8279e3c453cbf98e41eec46aec3e7", package = "leo-ast" }
leo-disassembler = { git = "https://github.com/ProvableHQ/leo", rev = "c82f149e97b8279e3c453cbf98e41eec46aec3e7", package = "leo-disassembler" }
leo-span = { git = "https://github.com/ProvableHQ/leo", rev = "c82f149e97b8279e3c453cbf98e41eec46aec3e7", package = "leo-span" }
# Unify the crates.io snarkVM version with Leo so Process<N> and Program<N>
# use the same types. Keep ABI-only features isolated from the main SDK.
snarkvm = { version = "4.10.0", features = ["test_consensus_heights", "dev_skip_checks", "test_targets", "history"] }

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.dev]
opt-level = 3
lto = "off"
incremental = true

[project]
name = "aleo-bridge-sdk"
version = "0.1.0"
description = "Python SDK for bridging assets between Aleo, Ethereum and Solana over Hyperlane warp routes and Circle xReserve"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aleo-sdk>=0.5.0", "requests>=2"]

[project.optional-dependencies]
evm = ["web3>=7,<9", "eth-account>=0.13"]
solana = ["solders>=0.21", "solana>=0.35"]
# mcp 2.0 renamed the Server registration API — pin to 1.x (same rule as shield-swap).
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "web3>=7,<9", "eth-account>=0.13",
       "solders>=0.21", "solana>=0.35", "mcp>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/aleo_bridge"]

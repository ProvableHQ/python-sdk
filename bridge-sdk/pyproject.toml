[project]
name = "aleo-bridge-sdk"
version = "0.6.0"
description = "Bridge Aleo, Ethereum, Arc, Base, Arbitrum and Solana assets with Hyperlane, Circle xReserve and CCTP"
readme = "README.md"
requires-python = ">=3.10"
# PyNaCl is NOT optional: every Aleo-side execution goes through delegated proving
# (`proving="delegate"`, the default), and the proving request is sealed with a NaCl box before it
# leaves the machine — without it `complete`/`execute` raise ImportError at the last step, after the
# source transaction is already on chain. `aleo-sdk[dps]` pulls the same package.
# Every chain family is a base dependency: one `pip install aleo-bridge-sdk` gives Aleo, Ethereum and
# Solana legs alike, so a checkpoint written on one machine can always be recovered on another.
dependencies = ["aleo-sdk>=0.5.0", "requests>=2", "pynacl>=1.5",
                "web3>=7,<9", "eth-account>=0.13",
                "solders>=0.21", "solana>=0.35"]

[project.optional-dependencies]
# mcp 2.0 renamed the Server registration API — pin to 1.x (same rule as shield-swap).
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/aleo_bridge"]

# Include only tutorial sources; local journals and checkpoints stay out.
[tool.hatch.build.targets.wheel.force-include]
"examples/_arc_workflow.py" = "aleo_bridge/examples/_arc_workflow.py"
"examples/bridge_arc_to_aleo.py" = "aleo_bridge/examples/bridge_arc_to_aleo.py"
"examples/bridge_ethereum_arc_aleo.py" = "aleo_bridge/examples/bridge_ethereum_arc_aleo.py"
"examples/l2_arc_aleo_roundtrip.py" = "aleo_bridge/examples/l2_arc_aleo_roundtrip.py"
"examples/__init__.py" = "aleo_bridge/examples/__init__.py"
"examples/_arguments.py" = "aleo_bridge/examples/_arguments.py"
"examples/bridge_sol.py" = "aleo_bridge/examples/bridge_sol.py"
"examples/bridge_sol_to_solana.py" = "aleo_bridge/examples/bridge_sol_to_solana.py"
"examples/bridge_usdc_private_balance.py" = "aleo_bridge/examples/bridge_usdc_private_balance.py"
"examples/bridge_usdc_private_recipient.py" = "aleo_bridge/examples/bridge_usdc_private_recipient.py"
"examples/bridge_usdcx_to_ethereum.py" = "aleo_bridge/examples/bridge_usdcx_to_ethereum.py"
"examples/bridge_wbtc.py" = "aleo_bridge/examples/bridge_wbtc.py"
"examples/bridge_wbtc_to_ethereum.py" = "aleo_bridge/examples/bridge_wbtc_to_ethereum.py"
"examples/quote_transfer.py" = "aleo_bridge/examples/quote_transfer.py"
"examples/recover_from_journal.py" = "aleo_bridge/examples/recover_from_journal.py"
"examples/recover_without_files.py" = "aleo_bridge/examples/recover_without_files.py"
"examples/shield_assets.py" = "aleo_bridge/examples/shield_assets.py"
"examples/README.md" = "aleo_bridge/examples/README.md"
